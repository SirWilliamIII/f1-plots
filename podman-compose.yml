version: '3.8'

services:
  flask-app:
    image: localhost/f1-flask-app:latest
    ports:
      - "8080:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - PYTHONUNBUFFERED=1
      - MATPLOTLIB_BACKEND=Agg
      - PORT=8080
      - FLASK_ENV=production
    volumes:
      - ./fastf1_cache:/app/fastf1_cache:Z
      - ./static/plots:/app/static/plots:Z
      - ./logs:/app/logs:Z
    depends_on:
      - ollama
    networks:
      - f1-network
    restart: unless-stopped
    mem_limit: 8g
    cpus: 2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  ollama:
    image: docker.io/ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama:Z
    networks:
      - f1-network
    restart: unless-stopped
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
      - OLLAMA_NUM_PARALLEL=2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    mem_limit: 14g
    cpus: 3

volumes:
  ollama_data:
    driver: local

networks:
  f1-network:
    driver: bridge
