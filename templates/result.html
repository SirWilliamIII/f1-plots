<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-753TJTNXPC"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-753TJTNXPC");
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>F1 Telemetry Comparison</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='styles.css') }}"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  </head>
  <body id="result-body">
    <div class="container">
      <!-- Ultra-compact header - everything in one 50px line -->
      <div class="header">
        <div class="race-info" style="margin-bottom: 0">
          {{ race_title }} • {{ session_name }}
        </div>
        <div class="driver-time">
          <span class="driver-name">{{ drv1_abbr }}</span>
          <span class="lap-time">{{ drv1_lap_time }}</span>
        </div>
        <div class="vs-separator"></div>
        <div class="driver-time">
          <span class="driver-name driver2">{{ drv2_abbr }}</span>
          <span class="lap-time">{{ drv2_lap_time }}</span>
        </div>
        <div class="actions">
          <a href="/" class="btn btn-primary">Generate New Plot</a>
          <button onclick="downloadPDF()" class="btn btn-secondary">
            Download PDF
          </button>
        </div>
      </div>

      <!-- Plot Section - Takes up ~95% of viewport -->
      <div class="plot-section">
        <div class="plot-container">
          {% if plot_path %}
          <img
            src="{{ plot_path }}"
            alt="Telemetry Comparison"
            loading="lazy"
          />
          {% else %}
          <div class="plot-loading">Loading telemetry data...</div>
          {% endif %}
        </div>
      </div>
    </div>

    <script src="{{ url_for('static', filename='main.js') }}"></script>
  </body>
</html>
