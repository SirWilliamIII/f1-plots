<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>F1 Telemetry Comparison</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <form class="f1-form-container" id="f1Form" method="POST" action="/">
    <div class="f1-header">
      <h1>F1 Telemetry Comparison</h1>
      <p>Compare fastest laps between any two drivers in any recent Grand Prix.</p>
    </div>
    <nav class="f1-stepper" aria-label="Progress">
      <div class="f1-step active" data-step="0">Year</div>
      <div class="f1-step" data-step="1">Grand Prix</div>
      <div class="f1-step" data-step="2">Drivers</div>
    </nav>
    <div class="f1-accordion">
      <!-- Step 1: Year -->
      <section class="f1-accordion-section" aria-expanded="true" id="step0">
        <button type="button" class="f1-accordion-header" aria-controls="panel0" aria-expanded="true">
          <span>Select Year</span>
          <span class="arrow">&#9654;</span>
        </button>
        <div class="f1-accordion-panel" id="panel0">
          <div class="f1-form-group">
            <label for="year">Championship Year</label>
            <select name="year" id="year" required>
              <option value="">Select year...</option>
              {% for year in years %}
                <option value="{{ year }}">{{ year }}</option>
              {% endfor %}
            </select>
          </div>
        </div>
      </section>
      <!-- Step 2: Grand Prix -->
      <section class="f1-accordion-section" aria-expanded="false" id="step1">
        <button type="button" class="f1-accordion-header" aria-controls="panel1" aria-expanded="false" disabled>
          <span>Select Grand Prix</span>
          <span class="arrow">&#9654;</span>
        </button>
        <div class="f1-accordion-panel" id="panel1">
          <div class="f1-form-group">
            <label for="race">Grand Prix</label>
            <select name="race" id="race" disabled required>
              <option value="">Select Grand Prix...</option>
            </select>
          </div>
        </div>
      </section>
      <!-- Step 3: Drivers -->
      <section class="f1-accordion-section" aria-expanded="false" id="step2">
        <button type="button" class="f1-accordion-header" aria-controls="panel2" aria-expanded="false" disabled>
          <span>Select Drivers</span>
          <span class="arrow">&#9654;</span>
        </button>
        <div class="f1-accordion-panel" id="panel2">
          <div id="driver-loading-spinner">
            <div class="spinner"></div>
            <div style="color:#888; margin-top:0.5em;">Loading drivers...</div>
          </div>
          <div class="f1-form-group">
            <label for="driver1">Driver 1</label>
            <select name="driver1" id="driver1" disabled required>
              <option value="">Select first driver...</option>
            </select>
          </div>
          <div class="f1-form-group">
            <label for="driver2">Driver 2</label>
            <select name="driver2" id="driver2" disabled required>
              <option value="">Select second driver...</option>
            </select>
          </div>
        </div>
      </section>
    </div>
    <div class="f1-summary" id="summary" style="display:none"></div>
    <div class="f1-form-actions">
      <button type="button" class="f1-btn" id="resetBtn" style="background:#e0e0e0;color:#333;" tabindex="-1">Reset</button>
      <button type="submit" class="f1-btn" id="submitBtn" disabled>Compare Laps</button>
    </div>
  </form>
  <script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
