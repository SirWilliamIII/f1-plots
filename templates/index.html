<!DOCTYPE html>
<html>
<head>
  <!-- Google Tag Manager -->

new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=

<!-- End Google Tag Manager -->
  <title>F1 Telemetry Compare</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    
  </style>
</head>
<body>
  <!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MM4NF82W"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
  {% if not driver_options %}
  <div class="form-box">
    <h3>Choose the Race</h3>
    <form method="POST">
      <label for="year">Year:</label>
      <select name="year" id="year" required>
        {% for year in years %}
        <option value="{{ year }}" {% if selected_year == year %}selected{% endif %}>{{ year }}</option>
        {% endfor %}
      </select>

      <label for="race">Race:</label>
      <select name="race" id="race" required>
        {% for race in races %}
        <option value="{{ race }}" {% if selected_race == race %}selected{% endif %}>{{ race }}</option>
        {% endfor %}
      </select>

      <label for="session">Session:</label>
      <select name="session" id="session" required>
        {% for sess in sessions %}
        <option value="{{ sess }}" {% if selected_session == sess %}selected{% endif %}>{{ sess }}</option>
        {% endfor %}
      </select>

      <button id="select-drivers-btn" type="submit"><span id="select-drivers-btn-text">SELECT DRIVERS</span><span id="loading-dots" style="display:none">&nbsp;<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></span></button>
    </form>
  </div>
  <script>
    // Only attach if the button exists
    document.addEventListener('DOMContentLoaded', function() {
      var btn = document.getElementById('select-drivers-btn');
      if (btn) {
        btn.addEventListener('click', function(e) {
          var text = document.getElementById('select-drivers-btn-text');
          var dots = document.getElementById('loading-dots');
          if (text && dots) {
            text.textContent = 'Loading Drivers';
            dots.style.display = 'inline';
            // Do not disable the button to allow form submission
          }
        });
      }
    });
  </script>
  <style>
    .dot {
      animation: blink 1.2s infinite both;
      opacity: 0.3;
      font-weight: bold;
      font-size: 1.2em;
    }
    .dot:nth-child(1) { animation-delay: 0s; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink {
      0%, 80%, 100% { opacity: 0.3; }
      40% { opacity: 1; }
    }
  </style>
  {% endif %}

  {% if driver_options %}
  <div class="driver-select-box">
    <h3>Select Drivers to Compare</h3>
    <form method="POST">
      <input type="hidden" name="year" value="{{ selected_year }}">
      <input type="hidden" name="race" value="{{ selected_race }}">
      <input type="hidden" name="session" value="{{ selected_session }}">
      <label for="driver1">Driver 1:</label>
      <select name="driver1" id="driver1" required>
        {% for d in driver_options %}
        <option value="{{ d.abbreviation }}">{{ d.broadcast_name }}</option>
        {% endfor %}
      </select>
      <label for="driver2">Driver 2:</label>
      <select name="driver2" id="driver2" required>
        {% for d in driver_options %}
        <option value="{{ d.abbreviation }}">{{ d.broadcast_name }}</option>
        {% endfor %}
      </select>
      <button id="compare-button" type="submit">Compare</button>
    </form>
  </div>
  {% endif %}
</body>
</html>
