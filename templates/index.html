<!DOCTYPE html>
<html>
  <head>

        j.src = "https://www.googletagmanager.com/gtm.js?id=" + i + dl;
        f.parentNode.insertBefore(j, f);

    </script>
    <!-- End Google Tag Manager -->
    <title>F1 Telemetry Compare</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='styles.css') }}"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap"
      rel="stylesheet"
    />

  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript
      ><iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-MM4NF82W"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
      ></iframe
    ></noscript>

    <body>
  <div id="first-load-warning" style="display: none;">
    
    Loading drivers after clicking button may take upwards of a minute. It is searching for the drivers that raced in the selected Grand Prix.
    <br />
  </div>
  <!-- ...rest of your content... -->
</body>
    <!-- End Google Tag Manager (noscript) -->
    <div class="multi-step-form">
      <!-- Step 1 -->
      <div class="step-box" id="step1">
        <h3 class="step-title" data-target="step1-content">Choose Year and Session</h3>
        <div class="step-content" id="step1-content">
          <form id="form-year-session">
            <label for="year">Year:</label>
            <select name="year" id="year" required>
              {% for year in years %}
              <option value="{{ year }}">{{ year }}</option>
              {% endfor %}
            </select>
            <label for="session">Session:</label>
            <select name="session" id="session" required>
              {% for sesh in sessions %}
              <option value="{{ sesh }}">{{ sesh }}</option>
              {% endfor %}
            </select>
            <button type="button" id="btn-to-step2">
              <span id="btn-to-step2-text">Choose Grand Prix</span>
              <span id="btn-to-step2-loader" style="display: none; vertical-align: middle; margin-left: 10px">
                <span class="loader"></span>
                <span id="btn-to-step2-loading-msg" style="margin-left: 8px"></span>
              </span>
            </button>
          </form>
        </div>
      </div>

      <!-- Step 2 -->
      <div class="step-box" id="step2">
        <h3 class="step-title" data-target="step2-content">Select Grand Prix</h3>
        <div class="step-content collapsed" id="step2-content">
          <form id="form-grand-prix" method="POST" action="/">
            <input type="hidden" name="year" id="hidden-year" />
            <input type="hidden" name="session" id="hidden-session" />
            <label for="race">Race:</label>
            <select name="race" id="race" required disabled>
              <option value="">Select a country</option>
            </select>
            <button type="button" id="btn-to-step3" disabled>
              <span id="btn-to-step3-text">Choose Drivers</span>
              <span id="btn-to-step3-loader" style="display: none; vertical-align: middle; margin-left: 10px">
                <span class="loader"></span>
              </span>
            </button>
          </form>
        </div>
      </div>

      <!-- Step 3 -->
      <div class="step-box" id="step3">
        <h3 class="step-title" data-target="step3-content">Select Drivers to Compare</h3>
        <div class="step-content collapsed" id="step3-content">
          <form method="POST" action="/" id="form-drivers">
            <input type="hidden" name="year" id="driver-year" />
            <input type="hidden" name="session" id="driver-session" />
            <input type="hidden" name="race" id="driver-race" />
            <label for="driver1">Driver 1:</label>
            <select name="driver1" id="driver1" required disabled>
              <option value="">Select driver 1</option>
            </select>
            <label for="driver2">Driver 2:</label>
            <select name="driver2" id="driver2" required disabled>
              <option value="">Select driver 2</option>
            </select>
            <div>
              <button type="submit" id="btn-generate-plots" disabled>
                <span id="btn-generate-plots-text">Generate Plots</span>
                <span id="btn-generate-plots-loader" style="display: none; vertical-align: middle; margin-left: 10px">
                  <span class="loader"></span>
                </span>
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="{{ url_for('static', filename='main.js') }}"></script>
  </body>
</html>
