<!DOCTYPE html>
<html>
  <head>

        w[l].push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
        var f = d.getElementsByTagName(s)[0],
          j = d.createElement(s),
          dl = l != "dataLayer" ? "&l=" + l : "";
        j.async = true;
        j.src = "https://www.googletagmanager.com/gtm.js?id=" + i + dl;
        f.parentNode.insertBefore(j, f);
      })(window, document, "script", "dataLayer", "GTM-MM4NF82W");
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
      integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <!-- End Google Tag Manager -->
    <title>F1 Telemetry Compare</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='styles.css') }}"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript
      ><iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-MM4NF82W"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
      ></iframe
    ></noscript>
    <!-- End Google Tag Manager (noscript) -->

    <div class="form-stack">
      <div class="form-box" id="form1-container">
        <h3>Choose Year and Session</h3>
        <form id="form1">
          <label for="year">Year:</label>
          <select name="year" id="year" required>
            {% for year in years %}
            <option value="{{ year }}">{{ year }}</option>
            {% endfor %}
          </select>

          <label for="session">Session:</label>
          <select name="session" id="session" required>
            {% for sesh in sessions %}
            <option value="{{ sesh }}">{{ sesh }}</option>
            {% endfor %}
          </select>

          <button type="button" id="getYear">
            <span id="getYear-text">Choose Grand Prix</span>
            <span
              id="getYear-loader"
              style="display: none; vertical-align: middle; margin-left: 10px"
            >
              <span class="loader"></span>
              <span id="getYear-loading-msg" style="margin-left: 8px"></span>
            </span>
          </button>
        </form>
      </div>
    </div>

    <div class="form-box" id="form2-container">
      <h3>Select Grand Prix</h3>
      <form id="form2" method="POST" action="/">
        <input type="hidden" name="year" id="hidden-year" />
        <input type="hidden" name="session" id="hidden-session" />
        <label for="race">Race:</label>
        <select name="race" id="race" required disabled>
          <option value="">Select a country</option>
        </select>
        <button type="button" id="choose-drivers-btn" disabled>
          <span id="choose-drivers-btn-text">Choose Drivers</span>
          <span
            id="choose-drivers-loader"
            style="display: none; vertical-align: middle; margin-left: 10px"
          >
            <span class="loader"></span>
          </span>
        </button>
      </form>
    </div>

    <div class="form-box" id="driver-select-container">
      <form
        method="POST"
        action="/"
        id="driver-select-form"
        class="modal-content"
      >
        <h1 class="h3 mb-3 fw-normal">Select Drivers to Compare</h1>
        <div>
          <input
            type="hidden"
            name="year"
            id="driver-year"
            class="form-control"
            placeholder="Year"
          />
        </div>
        <div>
          <input
            type="hidden"
            name="session"
            id="driver-session"
            class="form-control"
            placeholder="Session"
          />
        </div>
        <div>
          <input
            type="hidden"
            name="race"
            id="driver-race"
            class="form-control"
            placeholder="Race"
          />
        </div>
        <label style="padding: 1rem 0.75rem" for="driver1">Driver 1:</label>
        <select
          name="driver1"
          id="driver1"
          class="form-check text-start my-3"
          required
          disabled
        >
          <option value="">Select driver 1</option>
        </select>
        <label style="padding: 1rem 0.75rem" for="driver2">Driver 2:</label>
        <select
          name="driver2"
          id="driver2"
          class="form-check text-start my-3"
          required
          disabled
        >
          <option value="">Select driver 2</option>
        </select>
        <div>
          <button type="submit" id="select-drivers-btn" disabled>
            <span id="select-drivers-btn-text">Generate Plots</span>
            <span
              id="select-drivers-loader"
              style="display: none; vertical-align: middle; margin-left: 10px"
            >
              <span class="loader"></span>
            </span>
          </button>
        </div>
      </form>
    </div>

    <script src="{{ url_for('static', filename='main.js') }}"></script>
  </body>
</html>
